name: "Build kernels"

env:
  OUT_DIR: "${{ github.workspace }}/out"

on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  Set-repos:
    name: "🐂 Parse repos.json"
    runs-on: ubuntu-latest
    if: github.repository_owner == 'cvnertnc' && github.repository == 'cvnertnc/mykernelbuilder'
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
      builddate: ${{ steps.generate-builddate.outputs.builddate }}
    steps:
      - name: "😄 Checkout"
        uses: actions/checkout@v6

      - name: "🔓 Decrypt setup script"
        env:
          SCRIPT_KEY: ${{ secrets.SCRIPT_KEY }}
        run: |
          mkdir -p repos
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in .github/scripts/repos.x.json.enc \
            -out repos/repos.x.json \
            -pass pass:"$SCRIPT_KEY"

      - name: "😆 Generate Matrix"
        id: generate-matrix
        run: |
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          jq -s '[.[][]]' repos/repos*.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: "⏰ Set builddate"
        id: generate-builddate
        run: echo "builddate=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "🐎 Build kernel"
    runs-on: ubuntu-latest
    if: github.repository_owner == 'cvnertnc' && github.repository == 'cvnertnc/mykernelbuilder'
    needs:
      - Set-repos
    strategy:
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      WORKSPACE: ${{ github.workspace }}
      builddate: "${{ needs.Set-repos.outputs.builddate }}"

      KNAME: ${{ matrix.repos.kernelName }}
      KERNEL_DEVICE: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.defconfig }}

      withKernelSU: ${{ matrix.repos.withKernelSU }}
      withSUSFS: ${{ matrix.repos.withSUSFS }}
      withNoMount: ${{ matrix.repos.withNoMount }}
      withKPM: ${{ matrix.repos.withKPM }}
      withSpoof: ${{ matrix.repos.withSpoof }}
      ccache: ${{ matrix.repos.ccache }}
      useAnykernel: ${{ matrix.repos.AnyKernel3.use }}
      release: ${{ matrix.repos.AnyKernel3.release }}

    steps:
      - name: "😄 Checkout"
        uses: actions/checkout@v6

      - name: "🔓 Decrypt setup script"
        env:
          SCRIPT_KEY: ${{ secrets.SCRIPT_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in .github/scripts/build.sh.enc \
            -out /tmp/build.sh \
            -pass pass:"$SCRIPT_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in .github/scripts/mksp.patch.enc \
            -out /tmp/mksp.patch \
            -pass pass:"$SCRIPT_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in .github/scripts/ksu.patch.enc \
            -out /tmp/ksu.patch \
            -pass pass:"$SCRIPT_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in .github/scripts/rehooks.patch.enc \
            -out /tmp/rehooks.patch \
            -pass pass:"$SCRIPT_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in .github/scripts/nomount.patch.enc \
            -out /tmp/nomount.patch \
            -pass pass:"$SCRIPT_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in .github/scripts/legksu.patch.enc \
            -out /tmp/legksu.patch \
            -pass pass:"$SCRIPT_KEY"

          chmod +x /tmp/build.sh

      - name: "🧠 Set Kernel Variables"
        env:
          KERNEL_NAME: ${{ matrix.repos.kernelSource.name }}
          KERNEL_REPO: ${{ matrix.repos.kernelSource.repo }}
          KERNEL_BRANCH: ${{ matrix.repos.kernelSource.branch }}
          TOOLCHAINS: ${{ toJSON(matrix.repos.toolchains) }}
          PARAMS: ${{ toJSON(matrix.repos.params) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /tmp/build.sh -v

      - name: "🌟 Setup Environment"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          params: "${{ toJSON(matrix.repos.AnyKernel3) }}"
        run: /tmp/build.sh -e

      - name: "🚄 Create cache key from `repos`"
        if: ${{ env.ccache == 'true' }}
        id: ccache_key
        run: |
          ccache -o compression=false -o cache_dir=$HOME/.ccache
          echo "CACHE_KEY=$(echo -n '${{ toJSON(matrix.repos) }}' | base64 -w 0 | cut -c -48)" >> $GITHUB_OUTPUT

      - name: "🚅 Cache ccache files"
        if: ${{ env.ccache == 'true' }}
        uses: actions/cache@v3
        with:
          path: |
            ~/.ccache
            ${{ env.OUT_DIR }}
          key: ccache-${{ env.KERNEL_NAME }}-${{ steps.ccache_key.outputs.CACHE_KEY }}-${{ env.builddate }}
          restore-keys: |
            ccache-${{ env.KERNEL_NAME }}-${{ steps.ccache_key.outputs.CACHE_KEY }}-${{ env.builddate }}

      - name: "😎 Set args and export to env"
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: /tmp/build.sh -a

      - name: "⛔ Integrate NoMount"
        id: integrate-nomount
        working-directory: ${{ env.KERNEL_NAME }}
        if: ${{ env.withNoMount == 'true' }}
        run: /tmp/build.sh -n

      - name: "😋 Integrate KernelSU"
        id: integrate-kernelsu
        working-directory: ${{ env.KERNEL_NAME }}
        if: ${{ env.withKernelSU == 'ksun' || env.withKernelSU == 'ksu'  }}
        run: /tmp/build.sh -k

      - name: "👍 Make defconfig"
        working-directory: ${{ env.KERNEL_NAME }}
        run: /tmp/build.sh -d

      - name: "🎶 Build kernel"
        working-directory: ${{ env.KERNEL_NAME }}
        run: |
          echo "PATH Variable: $PATH"
          if [ "$withSpoof" = "true" ]; then
            /tmp/build.sh -b
          else
            if [ "$ccache" = "true" ]; then
              eval ccache make ${{ env.ARGS }}
            else
              eval make ${{ env.ARGS }}
            fi
          fi

      - name: "☯️ KPM Injection"
        id: kpm-inject
        working-directory: ${{ env.KERNEL_NAME }}
        if: ${{ env.withKPM == 'true' }}
        run: /tmp/build.sh -kp

      - name: "❤️ Pack AnyKernel3.zip"
        if: ${{ env.useAnykernel == 'true' }}
        env:
          anykernel: "${{ env.WORKSPACE }}/${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}_${{ env.builddate }}${{ env.withKernelSU == 'ksun' || env.withKernelSU == 'ksu' && format('_KernelSU_{0}', steps.integrate-kernelsu.outputs.KERNELSU_VERSION) || '' }}"
        run: /tmp/build.sh -p

      - name: "💾 Upload AnyKernel3 image => (${{ env.builddate }})"
        uses: actions/upload-artifact@v7
        if: ${{ env.useAnykernel == 'true' }}
        with:
          name: "${{ env.KERNEL_DEVICE }}-${{ env.KERNEL_NAME }}_${{ env.builddate }}${{ env.withKernelSU == 'ksun' || env.withKernelSU == 'ksu' && format('_KernelSU_{0}', steps.integrate-kernelsu.outputs.KERNELSU_VERSION) || '' }}"
          path: AnyKernel3/*